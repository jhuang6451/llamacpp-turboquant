services:
  llama-server:
    image: ghcr.io/${IMAGE_NAME:-your-username/llamacpp_tq}:rtx50
    container_name: llama-server-turboquant-rtx50
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    environment:
      - LC_ALL=C.UTF-8
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command: >
      -m /models/your-model.gguf
      --host 0.0.0.0
      --port 8080
      -ngl 99
      -fa 1
      -ctk turbo4
      -ctv turbo4
      -c 32768
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
